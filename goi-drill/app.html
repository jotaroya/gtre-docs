<title>統一テスト語彙ドリル</title>
<meta name="description" content="統一テスト対策プリント（読み・書き・意味・カタカナ語）の全530問をカードと4択で練習できるドリル。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 一列のドリル帳。上に固定バー、中央にカード、下に採点ボタン。答案用紙の罫と朱の丸付けがモチーフ */
:root{
  --paper:#f7f8f6;      /* 答案用紙の白 */
  --sheet:#ffffff;
  --ink:#1d2430;        /* 墨 */
  --ink-2:#5b6474;
  --rule:#d9dee3;       /* 罫線 */
  --kon:#27407a;        /* 紺：アクセント */
  --kon-soft:#e6ebf6;
  --shu:#c8402e;        /* 朱：×と傍線 */
  --shu-soft:#fbe9e5;
  --ok:#2f7d55;
  --ok-soft:#e3f2ea;
  --warn:#b7791f;
  --warn-soft:#fbf1dd;
  --unseen:#e9ecef;
  --f-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14171c;--sheet:#1c2027;--ink:#e8eaee;--ink-2:#a3abb8;--rule:#323844;
  --kon:#8fa8e8;--kon-soft:#232c42;--shu:#f08a78;--shu-soft:#3a2420;
  --ok:#6fcf9a;--ok-soft:#1d3328;--warn:#e7b260;--warn-soft:#3a2f1c;--unseen:#2a2f38;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14171c;--sheet:#1c2027;--ink:#e8eaee;--ink-2:#a3abb8;--rule:#323844;
  --kon:#8fa8e8;--kon-soft:#232c42;--shu:#f08a78;--shu-soft:#3a2420;
  --ok:#6fcf9a;--ok-soft:#1d3328;--warn:#e7b260;--warn-soft:#3a2f1c;--unseen:#2a2f38;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;margin:0;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--kon);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.bar h1{font-family:var(--f-display);font-size:18px;margin:0;font-weight:700;letter-spacing:.04em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.bar h1 small{display:none}}
.bar h1 small{font-family:var(--f-ui);font-weight:500;font-size:12px;color:var(--ink-2);margin-left:6px;letter-spacing:0}
.iconbtn{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:13px}
.today{font-size:12px;color:var(--ink-2);white-space:nowrap}
.today b{color:var(--kon);font-size:15px}

/* home */
.lead{padding-block:18px 6px;color:var(--ink-2);font-size:13px}
.test{margin-top:18px}
.test h2{font-family:var(--f-display);font-size:15px;margin:0 0 8px;letter-spacing:.08em;color:var(--ink-2);font-weight:500}
.sets{display:grid;gap:10px}
.set{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;text-align:left;width:100%}
.set:hover{border-color:var(--kon)}
.set .nm{font-family:var(--f-display);font-size:19px;font-weight:700}
.set .nm span{font-family:var(--f-ui);font-size:12px;color:var(--ink-2);font-weight:400;margin-left:8px}
.set .pct{font-size:22px;font-weight:700;color:var(--kon);text-align:right;line-height:1}
.set .pct small{display:block;font-size:11px;color:var(--ink-2);font-weight:400;margin-top:4px}
.meter{grid-column:1/-1;display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--unseen)}
.meter i{display:block;height:100%}
.m-ok{background:var(--ok)}.m-mid{background:var(--warn)}.m-ng{background:var(--shu)}
.legend{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}

/* set page */
.back{background:none;border:0;color:var(--kon);padding:14px 0 4px;font-size:14px}
.sethead h2{font-family:var(--f-display);font-size:26px;margin:4px 0 2px}
.sethead p{margin:0;color:var(--ink-2);font-size:13px}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;margin-top:14px}
.panel h3{font-size:13px;margin:0 0 10px;color:var(--ink-2);font-weight:500;letter-spacing:.06em}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.opt{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:10px 12px;text-align:left}
.opt b{display:block;font-size:15px}
.opt span{font-size:12px;color:var(--ink-2);line-height:1.4;display:block}
.opt[aria-pressed="true"]{border-color:var(--kon);background:var(--kon-soft);box-shadow:inset 0 0 0 1px var(--kon)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:12px;font-size:14px}
.row label{display:flex;align-items:center;gap:6px}
select,input[type=number]{font:inherit;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 8px}
input[type=number]{width:5.2em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--kon);border-color:var(--kon);color:var(--sheet)}
.start{margin-top:16px;width:100%;border:0;background:var(--kon);color:var(--sheet);font-size:17px;font-weight:700;border-radius:12px;padding:14px;letter-spacing:.1em}
.start:disabled{opacity:.4}
.hint{font-size:12px;color:var(--ink-2);margin-top:8px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:4px}
.cell{aspect-ratio:1;max-width:100%;border:0;border-radius:6px;font-size:11px;background:var(--unseen);color:var(--ink-2);padding:0}
.cell.ok{background:var(--ok);color:var(--sheet)}
.cell.mid{background:var(--warn);color:var(--sheet)}
.cell.ng{background:var(--shu);color:var(--sheet)}

.list{margin-top:10px;display:grid;gap:0}
.li{display:grid;grid-template-columns:2.6em 1fr;gap:4px 10px;padding:10px 6px;border-top:1px solid var(--rule);align-items:baseline;border-radius:6px}
.li[role=button]{cursor:pointer;user-select:none;-webkit-user-select:none}
.li[role=button]:hover{background:var(--paper)}
.li .n{color:var(--ink-2);font-size:12px;text-align:right}
.li .q{font-family:var(--f-display);font-size:16px;min-width:0}
.li .a{grid-column:2;font-size:15px;color:var(--shu);font-weight:700;min-width:0;position:relative;justify-self:start;padding:1px 6px;margin-left:-6px;border-radius:4px}
.li .a::before{content:"";position:absolute;inset:0;border-radius:4px;background:var(--shu);opacity:0;transition:opacity .15s}
.li.hide .a::before{opacity:.82}
.li.hide .a{color:transparent;min-width:9.5em}
.li.hide .a .ref{color:transparent}
.li.hide .a::after{content:"タップでめくる";position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--sheet);font-size:11px;font-weight:500;white-space:nowrap}
.li .a .ref{color:var(--ink-2);font-weight:400;font-size:11px;margin-left:8px}
.li .tg{display:none}
@media (prefers-reduced-motion:reduce){.li .a::before{transition:none}}
.li.flash{background:var(--kon-soft)}

/* drill */
.drill{display:flex;flex-direction:column;min-height:calc(100dvh - 60px);padding-block:12px 16px}
.dtop{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.prog{flex:1;height:6px;background:var(--unseen);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--kon);transition:width .2s}
.quit{background:none;border:0;color:var(--ink-2);font-size:13px;padding:4px}
.card{position:relative;margin-top:14px;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:20px 18px 18px;min-height:280px;display:flex;flex-direction:column;cursor:pointer}
.card.choice{cursor:default}
.cmeta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2)}
.hist{display:flex;gap:3px;align-items:center}
.hist i{width:7px;height:7px;border-radius:50%;background:var(--unseen)}
.hist i.o{background:var(--ok)}.hist i.x{background:var(--shu)}
.sent{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 4px;font-family:var(--f-display);font-size:clamp(20px,5.6vw,26px);line-height:2.1;text-align:left}
.sent>div{min-width:0}
.sent.tate>div{writing-mode:vertical-rl;height:min(15em,52dvh);line-height:1.9;text-align:start}
.bl{text-decoration:underline;text-decoration-color:var(--shu);text-decoration-thickness:2px;text-underline-offset:.28em;font-weight:700}
.tate .bl{text-underline-position:right}
.word{font-size:clamp(30px,9vw,40px);font-weight:700;letter-spacing:.06em;text-align:center}
rt{font-size:.5em;font-family:var(--f-ui);color:var(--ink-2)}
.bl rt{color:var(--shu);font-weight:700}
.ans{border-top:2px dashed var(--rule);padding-top:12px;text-align:center}
.ans .big{font-family:var(--f-display);font-size:clamp(26px,8vw,34px);font-weight:700;color:var(--shu);line-height:1.4}
.ans .ref{font-size:12px;color:var(--ink-2)}
.tap{text-align:center;color:var(--ink-2);font-size:13px;border-top:2px dashed var(--rule);padding-top:12px}
.card.flipin .ans{animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stamp{position:absolute;right:14px;top:34px;font-family:var(--f-display);font-size:64px;line-height:1;font-weight:700;pointer-events:none;animation:stamp .25s ease-out}
.stamp.o{color:var(--shu)}.stamp.x{color:var(--kon)}
@keyframes stamp{from{transform:scale(1.6);opacity:0}to{transform:none;opacity:.9}}
@media (prefers-reduced-motion:reduce){.card.flipin .ans,.stamp{animation:none}}

.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.grade button{border:0;border-radius:14px;padding:16px 8px;font-size:17px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.grade .x{background:var(--kon-soft);color:var(--kon)}
.grade .o{background:var(--shu-soft);color:var(--shu)}
.grade small{font-size:11px;font-weight:400;opacity:.8}
.flipbtn{margin-top:14px;width:100%;border:1px solid var(--kon);background:var(--sheet);color:var(--kon);border-radius:14px;padding:16px;font-size:17px;font-weight:700}
.choices{display:grid;gap:8px;margin-top:12px}
.ch{text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:12px;padding:12px 14px;font-size:15px;display:grid;grid-template-columns:1.6em 1fr;gap:6px;line-height:1.5}
.ch .k{color:var(--ink-2);font-weight:700}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.wrong{border-color:var(--shu);background:var(--shu-soft)}
.ch:disabled{cursor:default;color:var(--ink)}
.next{margin-top:12px;width:100%;border:0;background:var(--kon);color:var(--sheet);border-radius:14px;padding:15px;font-size:17px;font-weight:700}
.tools{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.tools button{background:none;border:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:4px}
.kbd{display:none}
@media (hover:hover) and (pointer:fine){.kbd{display:inline}}

/* 手書きメモ */
.pad{margin-top:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.pad canvas{display:block;width:100%;height:150px;touch-action:none;background-image:linear-gradient(90deg,transparent calc(50% - .5px),var(--rule) calc(50% - .5px),var(--rule) calc(50% + .5px),transparent calc(50% + .5px))}
.pad .ph{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--rule)}
.pad .ph button{background:none;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:12px}

/* result */
.res h2{font-family:var(--f-display);font-size:24px;margin:18px 0 4px}
.score{display:flex;align-items:baseline;gap:10px;margin:8px 0 4px}
.score b{font-family:var(--f-display);font-size:56px;color:var(--shu);line-height:1}
.score span{color:var(--ink-2)}
.btns{display:grid;gap:8px;margin-top:14px}
.btn2{border:1px solid var(--kon);background:var(--sheet);color:var(--kon);border-radius:12px;padding:13px;font-size:15px;font-weight:700}
.btn2.solid{background:var(--kon);color:var(--sheet)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.sheet{background:var(--sheet);color:var(--ink);border-radius:16px;max-width:520px;width:100%;padding:18px;max-height:85dvh;overflow:auto}
.sheet h3{margin:0 0 10px;font-family:var(--f-display);font-size:19px}
.sheet .row{margin-top:10px}
.danger{border:1px solid var(--shu);color:var(--shu);background:none;border-radius:10px;padding:9px 14px}
.danger.solid{background:var(--shu);color:var(--sheet)}
/* QR */
.qrbox{display:flex;justify-content:center;padding:12px;background:#fff;border-radius:12px;border:1px solid var(--rule)}
.qrbox svg{width:min(260px,70vw);height:auto;display:block}
.qrurl{font-size:12px;color:var(--ink-2);word-break:break-all;margin-top:8px}
.qrin{width:100%;font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 9px}
.qrfull{position:fixed;inset:0;z-index:40;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;cursor:pointer}
.qrfull svg{width:min(80vmin,640px);height:auto}
.qrfull p{margin:0;font-family:var(--f-display);font-size:clamp(18px,3.4vmin,30px);font-weight:700;text-align:center}
.qrfull small{font-size:13px;color:#555}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:13px;z-index:30}
</style>

<div class="bar"><div class="in">
  <h1 id="ttl">統一テスト語彙ドリル<small>入試頻出漢字＋現代文重要語彙TOP2500</small></h1>
  <span class="today num" id="today"></span>
  <button class="iconbtn" id="qrBtn" type="button" aria-label="QRコードを表示">QR</button>
  <button class="iconbtn" id="setBtn" type="button" aria-label="設定">設定</button>
</div></div>
<main class="wrap" id="app"></main>
<div id="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script id="qdata" type="application/json">/*DATA*/</script>
<script>
(()=>{
const SETS = JSON.parse(document.getElementById('qdata').textContent);
const SET = Object.fromEntries(SETS.map(s=>[s.id,s]));
const $ = s=>document.querySelector(s);
const app = $('#app');
const KEY='goiDrill.v1';

/* ---------- 保存 ---------- */
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{} }catch(e){ return {} } }
let DB = load();
DB.st ??= {}; DB.pref ??= {tate:false,pad:true}; DB.days ??= {}; DB.last ??= {};
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)) }catch(e){} }
const dayKey = ()=>{ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate() };

/* ---------- 成績 ---------- */
const sid=(set,i)=>set+':'+i;
const stat=id=>DB.st[id];
function record(id,ok){
  const s = DB.st[id] ??= {n:0,c:0,h:''};
  s.n++; if(ok) s.c++;
  s.h=(s.h+(ok?'1':'0')).slice(-8);
  s.t=Date.now();
  const k=dayKey(); DB.days[k]=(DB.days[k]||0)+1;
  save(); renderToday();
}
// 状態: unseen / ok(定着) / mid(あやしい) / ng(苦手)
function level(id){
  const s=stat(id); if(!s) return 'unseen';
  const last=s.h.slice(-1), r3=s.h.slice(-3), acc=s.c/s.n;
  if(last==='0') return 'ng';
  if(r3.length>=2 && !r3.includes('0') && acc>=.75) return 'ok';
  return acc<.5 ? 'ng' : 'mid';
}
// 苦手度（大きいほど先に出す）
function weakness(id){
  const s=stat(id); if(!s) return .55;
  const acc=(s.c+1)/(s.n+2);
  let w=1-acc;
  if(s.h.slice(-1)==='0') w+=.45;
  if(s.h.slice(-2)==='00') w+=.2;
  if(s.h.slice(-3)==='111') w-=.3;
  const days=(Date.now()-(s.t||0))/864e5; w+=Math.min(days,14)*.01; // 久しぶりの問題も少し優先
  return w;
}
function setSummary(set){
  const c={unseen:0,ok:0,mid:0,ng:0}; let n=0,cc=0;
  set.items.forEach((_,i)=>{ const id=sid(set.id,i); c[level(id)]++; const s=stat(id); if(s){n+=s.n;cc+=s.c} });
  return {...c,total:set.items.length,acc:n?Math.round(cc/n*100):null};
}

/* ---------- 文字列の描画 ---------- */
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rich(s){ // {ruby} と [傍線]
  return esc(s).replace(/(.)\{([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>').replace(/\[([^\]]+)\]/g,'<span class="bl">$1</span>');
}
const mainAns=a=>a.replace(/（.*?）/g,'');
function sentenceBack(set,it){
  if(set.id==='yomi'){ // 傍線部にふりがな
    return esc(it.q).replace(/(.)\{([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>').replace(/\[([^\]]+)\]/,(m,k)=>`<span class="bl"><ruby>${k}<rt>${esc(mainAns(it.a))}</rt></ruby></span>`);
  }
  return rich(it.q.replace(/\[([^\]]+)\]/,'['+mainAns(it.a)+']'));
}
const plain=s=>s.replace(/\{[^}]+\}/g,'');
const KANA='①②③④';

/* ---------- 画面: ホーム ---------- */
let view='home';
function home(){
  view='home';
  const tests=[...new Set(SETS.map(s=>s.test))];
  app.innerHTML=`<p class="lead">対策プリントの全${SETS.reduce((a,s)=>a+s.items.length,0)}問を収録。カードをめくって自己採点、意味は4択。記録はこの端末に保存され、苦手な問題から出題できます。</p>`+
  tests.map(t=>`<section class="test"><h2>${t}統一テスト</h2><div class="sets">${
    SETS.filter(s=>s.test===t).map(s=>{
      const m=setSummary(s), w=k=>(m[k]/m.total*100).toFixed(2)+'%';
      return `<button class="set" type="button" data-set="${s.id}">
        <div class="nm">${s.name}<span>${s.items.length}問・${s.range}</span></div>
        <div class="pct num">${m.acc==null?'—':m.acc+'%'}<small>正答率</small></div>
        <div class="meter"><i class="m-ok" style="width:${w('ok')}"></i><i class="m-mid" style="width:${w('mid')}"></i><i class="m-ng" style="width:${w('ng')}"></i></div>
        <div class="legend num"><span><i class="m-ok"></i>定着 ${m.ok}</span><span><i class="m-mid"></i>あやしい ${m.mid}</span><span><i class="m-ng"></i>苦手 ${m.ng}</span><span><i style="background:var(--unseen)"></i>未学習 ${m.unseen}</span></div>
      </button>`}).join('')}</div></section>`).join('');
  app.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>setPage(b.dataset.set));
  scrollTo(0,0);
}

/* ---------- 画面: セット ---------- */
let cfg={};
function setPage(id,keep){
  view='set'; const set=SET[id];
  const prev=DB.last[id]||{};
  if(!keep) cfg={set:id,mode:prev.mode||'order',from:1,to:set.items.length,count:prev.count||20,style:prev.style||(set.kind==='choice'?'choice':'card'),hide:true};
  const m=setSummary(set);
  const ngIds=set.items.map((_,i)=>i).filter(i=>level(sid(id,i))==='ng');
  const modes=[
    ['order','順番通り','番号順に出題'],
    ['random','ランダム','範囲からシャッフル'],
    ['weak','苦手優先','正答率の低い問題・未学習から'],
    ['wrong','間違えた問題',`直近で×の${ngIds.length}問だけ`],
  ];
  app.innerHTML=`<button class="back" type="button" id="bk">← 一覧へ</button>
  <div class="sethead"><h2>${set.name}</h2><p>${set.test}統一テスト対策・${set.range}・${set.items.length}問 ／ ${set.note}</p></div>
  <div class="panel"><h3>出題のしかた</h3>
    <div class="seg">${modes.map(([k,a,b])=>`<button type="button" class="opt" data-mode="${k}" aria-pressed="${cfg.mode===k}" ${k==='wrong'&&!ngIds.length?'disabled':''}><b>${a}</b><span>${b}</span></button>`).join('')}</div>
    <div class="row">
      <label>範囲 <input id="from" type="number" min="1" max="${set.items.length}" value="${cfg.from}" class="num"> 〜 <input id="to" type="number" min="1" max="${set.items.length}" value="${cfg.to}" class="num"></label>
    </div>
    <div class="row"><span>問題数</span><div class="chips">${[10,20,30,50,0].map(n=>`<button type="button" class="chip num" data-count="${n}" aria-pressed="${cfg.count===n}">${n||'全部'}</button>`).join('')}</div></div>
    ${set.kind==='choice'?`<div class="row"><span>形式</span><div class="chips"><button type="button" class="chip" data-style="choice" aria-pressed="${cfg.style==='choice'}">4択</button><button type="button" class="chip" data-style="card" aria-pressed="${cfg.style==='card'}">カード（意味を思い出す）</button></div></div>`:''}
    <button class="start" type="button" id="go">はじめる</button>
    <p class="hint" id="hint"></p>
  </div>
  <div class="panel"><h3>問題ごとの記録 <span class="num" style="float:right">${m.acc==null?'':'正答率 '+m.acc+'%'}</span></h3>
    <div class="grid">${set.items.map((_,i)=>{const l=level(sid(id,i));return `<button type="button" class="cell num ${l}" data-i="${i}" title="${i+1}">${i+1}</button>`}).join('')}</div>
    <p class="hint">緑＝定着　黄＝あやしい　赤＝苦手（直近で×）　灰＝未学習。番号をタップすると下の一覧に移動します。</p>
  </div>
  <div class="panel"><h3>一覧で確認</h3>
    <div class="chips"><button type="button" class="chip" id="hideT" aria-pressed="${cfg.hide}">答えをかくす（赤シート）</button></div>
    <p class="hint">問題をタップすると、その問題だけ赤シートをめくれます。もう一度タップでかぶせ直し。</p>
    <div class="list" id="list"></div>
  </div>`;
  $('#bk').onclick=home;
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.mode;setPage(id,true)});
  app.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{cfg.count=+b.dataset.count;setPage(id,true)});
  app.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{cfg.style=b.dataset.style;setPage(id,true)});
  const clampIn=()=>{const N=set.items.length;let f=Math.max(1,Math.min(N,+$('#from').value||1)),t=Math.max(1,Math.min(N,+$('#to').value||N));if(f>t)[f,t]=[t,f];cfg.from=f;cfg.to=t;hint()};
  $('#from').onchange=clampIn; $('#to').onchange=clampIn;
  $('#hideT').onclick=()=>{cfg.hide=!cfg.hide;$('#hideT').setAttribute('aria-pressed',cfg.hide);renderList(set)};
  app.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{const el=document.getElementById('li'+c.dataset.i);el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1200)});
  $('#go').onclick=()=>{const q=buildQueue();if(q.length){DB.last[id]={mode:cfg.mode,count:cfg.count,style:cfg.style};save();startDrill(set,q)}};
  function hint(){const q=buildQueue();$('#hint').textContent=q.length?`${q.length}問を出題します。`:'この条件にあう問題がありません。';$('#go').disabled=!q.length}
  hint(); renderList(set);
  if(!keep) scrollTo(0,0);
}
function renderList(set){
  $('#list').innerHTML=set.items.map((it,i)=>{
    const q = set.kind==='choice' ? `<b>${rich(it.word)}</b>` : rich(it.q);
    const a = set.kind==='choice' ? rich(it.opts[it.a-1]) : esc(it.a);
    return `<div class="li ${cfg.hide?'hide':''}" id="li${i}" role="button" tabindex="0" aria-label="${i+1}番の答えをめくる"><span class="n num">${i+1}</span><span class="q">${q}</span><span class="a">${a}<span class="ref">${it.ref}</span></span></div>`}).join('');
  // その問題だけ赤シートをめくる／かぶせる
  $('#list').querySelectorAll('.li').forEach(li=>{
    li.onclick=()=>li.classList.toggle('hide');
    li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();li.classList.toggle('hide')}};
  });
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function buildQueue(){
  const set=SET[cfg.set];
  let idx=[]; for(let i=cfg.from-1;i<cfg.to;i++) idx.push(i);
  if(cfg.mode==='random') shuffle(idx);
  if(cfg.mode==='weak'){ idx=idx.map(i=>[i,weakness(sid(set.id,i))+Math.random()*.08]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]); }
  if(cfg.mode==='wrong'){ idx=shuffle(idx.filter(i=>level(sid(set.id,i))==='ng')); }
  if(cfg.count) idx=idx.slice(0,cfg.count);
  if(cfg.mode==='weak') shuffle(idx);
  return idx;
}

/* ---------- 画面: ドリル ---------- */
let D=null;
function startDrill(set,queue){
  view='drill';
  D={set,queue,pos:0,res:[],flipped:false,answered:false,style:set.kind==='choice'?cfg.style:'card'};
  card();
}
function histDots(id){const h=(stat(id)?.h||'').padStart(5,'-').slice(-5);return `<span class="hist" title="過去5回の結果">${[...h].map(c=>`<i class="${c==='1'?'o':c==='0'?'x':''}"></i>`).join('')}</span>`}
function card(){
  const {set,queue,pos}=D; const i=queue[pos], it=set.items[i], id=sid(set.id,i);
  D.flipped=false; D.answered=false;
  const isChoice=D.style==='choice', isWritten=set.kind==='written';
  const tate=DB.pref.tate&&isWritten;
  let front;
  if(isWritten) front=`<div class="sent ${tate?'tate':''}"><div>${rich(it.q)}</div></div>`;
  else front=`<div class="sent"><div class="word">${rich(it.word)}</div></div>`;
  const prompt=set.id==='yomi'?'傍線部の読みは？':set.kind==='written'?'カタカナを漢字に':isChoice?'意味を選びなさい':'意味を思い出そう';
  let order=[0,1,2,3]; if(isChoice) shuffle(order); D.order=order;
  app.innerHTML=`<div class="drill">
    <div class="dtop num"><button class="quit" type="button" id="quit">✕ やめる</button><div class="prog"><i style="width:${pos/queue.length*100}%"></i></div><span>${pos+1} / ${queue.length}</span></div>
    <div class="card ${isChoice?'choice':''}" id="card" ${isChoice?'':'tabindex="0" role="button" aria-label="カードをめくる"'}>
      <div class="cmeta num"><span>${set.name} ${i+1}　${prompt}</span>${histDots(id)}</div>
      ${front}
      <div id="under">${isChoice?'':`<div class="tap">タップしてめくる <span class="kbd">（スペース）</span></div>`}</div>
    </div>
    <div id="ctrl">${isChoice?`<div class="choices">${order.map((o,k)=>`<button type="button" class="ch" data-o="${o}"><span class="k">${KANA[k]}</span><span>${rich(it.opts[o])}</span></button>`).join('')}</div>`
      :`<button class="flipbtn" type="button" id="flip">答えを見る</button>`}</div>
    ${isWritten&&DB.pref.pad?`<div class="pad"><canvas id="cv"></canvas><div class="ph"><span>手書きメモ（指やペンで書いてからめくる）</span><button type="button" id="clr">消す</button></div></div>`:''}
    <div class="tools"><span class="kbd">キー: スペース＝めくる　← ×　→ ○${isChoice?'　1〜4＝選択':''}</span><span></span>${isWritten?`<button type="button" id="tateT">${DB.pref.tate?'横書きにする':'縦書きにする'}</button>`:''}</div>
  </div>`;
  $('#quit').onclick=()=>finish(true);
  if(isChoice){ app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>choose(+b.dataset.o)); }
  else { $('#card').onclick=flip; $('#flip').onclick=flip; }
  if($('#tateT')) $('#tateT').onclick=()=>{DB.pref.tate=!DB.pref.tate;save();card()};
  if($('#cv')) pad();
}
function flip(){
  if(D.flipped) return; D.flipped=true;
  const {set,queue,pos}=D; const i=queue[pos], it=set.items[i];
  const c=$('#card'); c.classList.add('flipin'); c.style.cursor='default';
  if(set.kind==='written') c.querySelector('.sent>div').innerHTML=sentenceBack(set,it);
  const big=set.kind==='written'?esc(it.a):rich(it.opts[it.a-1]);
  $('#under').innerHTML=`<div class="ans"><div class="big" ${set.kind!=='written'?'style="font-size:20px;font-family:var(--f-ui)"':''}>${big}</div><div class="ref num">教科書 ${it.ref.replace('-','・')}</div></div>`;
  $('#ctrl').innerHTML=`<div class="grade"><button class="x" type="button" id="gx">× まだ<small>もう一度出す</small></button><button class="o" type="button" id="go2">○ できた<small>正解</small></button></div>`;
  $('#gx').onclick=()=>grade(false); $('#go2').onclick=()=>grade(true);
}
function grade(ok){
  if(D.answered) return; D.answered=true;
  const {set,queue,pos}=D; const i=queue[pos];
  record(sid(set.id,i),ok); D.res.push({i,ok});
  const st=document.createElement('div'); st.className='stamp '+(ok?'o':'x'); st.textContent=ok?'○':'✕'; $('#card').appendChild(st);
  setTimeout(next, 380);
}
function choose(o){
  if(D.answered) return; D.answered=true;
  const {set,queue,pos}=D; const i=queue[pos], it=set.items[i]; const ok=o===it.a-1;
  record(sid(set.id,i),ok); D.res.push({i,ok});
  app.querySelectorAll('.ch').forEach(b=>{b.disabled=true; const v=+b.dataset.o; if(v===it.a-1) b.classList.add('right'); else if(v===o) b.classList.add('wrong');});
  const st=document.createElement('div'); st.className='stamp '+(ok?'o':'x'); st.textContent=ok?'○':'✕'; $('#card').appendChild(st);
  $('#under').innerHTML=`<div class="ans"><div class="ref num">教科書 ${it.ref.replace('-','・')}</div></div>`;
  const b=document.createElement('button'); b.className='next'; b.type='button'; b.id='nx'; b.textContent=pos+1<queue.length?'次へ →':'結果を見る';
  b.onclick=next; $('#ctrl').appendChild(b); b.focus({preventScroll:true});
}
function next(){ D.pos++; if(D.pos>=D.queue.length) finish(); else card(); }
function finish(quit){
  const {set,res}=D; view='result';
  if(!res.length){ setPage(set.id); return; }
  const ok=res.filter(r=>r.ok).length, ng=res.filter(r=>!r.ok);
  const pct=Math.round(ok/res.length*100);
  app.innerHTML=`<div class="res">
    <h2>${quit?'ここまでの結果':'おつかれさま！'}</h2>
    <div class="score num"><b>${ok}</b><span>/ ${res.length}問正解（${pct}%）</span></div>
    <p class="hint">${pct===100?'全問正解。苦手優先モードで他の問題も確認しよう。':ng.length?'×の問題は「苦手」として記録され、苦手優先・間違えた問題モードで先に出ます。':''}</p>
    <div class="btns">
      ${ng.length?`<button class="btn2 solid" type="button" id="again">×の${ng.length}問をもう一度</button>`:''}
      <button class="btn2 ${ng.length?'':'solid'}" type="button" id="more">同じ設定で続ける</button>
      <button class="btn2" type="button" id="toSet">${set.name}のページへ</button>
    </div>
    ${ng.length?`<div class="panel"><h3>間違えた問題</h3><div class="list">${ng.map(r=>{const it=set.items[r.i];
      const q=set.kind==='choice'?`<b>${rich(it.word)}</b>`:rich(it.q); const a=set.kind==='choice'?rich(it.opts[it.a-1]):esc(it.a);
      return `<div class="li"><span class="n num">${r.i+1}</span><span class="q">${q}</span><span class="a">${a}<span class="ref">${it.ref}</span></span></div>`}).join('')}</div></div>`:''}
  </div>`;
  if(ng.length) $('#again').onclick=()=>startDrill(set,shuffle(ng.map(r=>r.i)));
  $('#more').onclick=()=>{cfg.set=set.id;const q=buildQueue();q.length?startDrill(set,q):setPage(set.id)};
  $('#toSet').onclick=()=>setPage(set.id);
  scrollTo(0,0);
}

/* ---------- 手書きメモ ---------- */
function pad(){
  const cv=$('#cv'), ctx=cv.getContext('2d'); const r=devicePixelRatio||1;
  const fit=()=>{cv.width=cv.clientWidth*r;cv.height=cv.clientHeight*r;ctx.scale(r,r);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=3.2;ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()};
  fit();
  let drawing=false,lx=0,ly=0;
  const p=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);[lx,ly]=p(e);ctx.beginPath();ctx.arc(lx,ly,1.4,0,7);ctx.fill();};
  cv.onpointermove=e=>{if(!drawing)return;const [x,y]=p(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();lx=x;ly=y};
  cv.onpointerup=cv.onpointercancel=()=>drawing=false;
  ctx.fillStyle=ctx.strokeStyle;
  $('#clr').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height)};
}

/* ---------- キーボード ---------- */
addEventListener('keydown',e=>{
  if(view!=='drill'||e.target.tagName==='INPUT') return;
  const choice=D.style==='choice';
  if(choice){
    if(!D.answered && /^[1-4]$/.test(e.key)){ choose(D.order[+e.key-1]); e.preventDefault(); }
    else if(D.answered && (e.key==='Enter'||e.key===' '||e.key==='ArrowRight')){ next(); e.preventDefault(); }
    return;
  }
  if(!D.flipped && (e.key===' '||e.key==='Enter')){ flip(); e.preventDefault(); }
  else if(D.flipped && (e.key==='ArrowRight'||e.key==='o')){ grade(true); e.preventDefault(); }
  else if(D.flipped && (e.key==='ArrowLeft'||e.key==='x')){ grade(false); e.preventDefault(); }
});

/* ---------- 今日の学習数・設定 ---------- */
function streak(){ let n=0; const d=new Date(); for(;;){ const k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); if(DB.days[k]){n++;d.setDate(d.getDate()-1)} else if(n===0&&k===dayKey()){d.setDate(d.getDate()-1)} else break; } return n }
function renderToday(){ const t=DB.days[dayKey()]||0, s=streak(); $('#today').innerHTML=`今日 <b>${t}</b>問${s>1?`・${s}日連続`:''}`; }
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,1800)}
$('#setBtn').onclick=()=>{
  const m=$('#modal'); m.hidden=false; m.className='modal';
  const total=Object.keys(DB.st).length;
  m.innerHTML=`<div class="sheet" role="dialog" aria-label="設定">
    <h3>設定</h3>
    <div class="row"><label><input type="checkbox" id="pTate" ${DB.pref.tate?'checked':''}> 読み・書きの問題文を縦書きで表示</label></div>

    <div class="panel" style="margin-top:16px"><h3>記録</h3>
      <p class="hint" style="margin-top:0">学習記録（${total}問ぶん）はこのブラウザだけに保存されています。別の端末やブラウザとは共有されません。</p>
      <div class="row"><select id="rsSet"><option value="">すべて</option>${SETS.map(s=>`<option value="${s.id}">${s.test} ${s.name}</option>`).join('')}</select>
      <button type="button" class="danger" id="rs">記録を消す</button></div>
      <div class="row" id="rsc" hidden><span>本当に消しますか？元に戻せません。</span><button type="button" class="danger solid" id="rsy">消す</button><button type="button" class="chip" id="rsn">やめる</button></div>
    </div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn2 solid" id="close" style="padding:9px 22px">閉じる</button></div>

  const close=()=>{m.hidden=true; if(view==='home')home(); else if(view==='set')setPage(cfg.set,true); else if(view==='drill')card();};
  $('#close').onclick=close; m.onclick=e=>{if(e.target===m)close()};
  $('#pTate').onchange=e=>{DB.pref.tate=e.target.checked;save()};
  $('#pPad').onchange=e=>{DB.pref.pad=e.target.checked;save()};
  $('#rs').onclick=()=>{$('#rsc').hidden=false};
  $('#rsn').onclick=()=>{$('#rsc').hidden=true};
  $('#rsy').onclick=()=>{const v=$('#rsSet').value; if(!v) DB.st={}; else Object.keys(DB.st).forEach(k=>{if(k.startsWith(v+':'))delete DB.st[k]}); save(); $('#rsc').hidden=true; toast('記録を消しました');};
};
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)$('#close')?.click()});


/* ---------- QRコード ---------- */
const QR_LIB='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
const DEFAULT_URL='https://jotaroya.github.io/gtre-docs/goi-drill/';
function selfUrl(){
  try{ const u=new URL(location.href);
    if(/^https?:$/.test(u.protocol) && !/claude|anthropic/.test(u.hostname)){ u.hash=''; return u.href; } }catch(e){}
  return null;
}
function loadQR(){ return window.qrcode ? Promise.resolve() : new Promise((ok,ng)=>{ const sc=document.createElement('script'); sc.src=QR_LIB; sc.onload=ok; sc.onerror=ng; document.head.appendChild(sc); }); }
function qrSvg(text){ const q=qrcode(0,'M'); q.addData(unescape(encodeURIComponent(text))); q.make(); return q.createSvgTag({cellSize:8,margin:2,scalable:true}); }
function openQR(){
  const m=$('#modal'); m.hidden=false; m.className='modal';
  const base = DB.qrUrl || selfUrl() || DEFAULT_URL;
  const cur = view==='set' ? cfg.set : (view==='drill'||view==='result') ? D.set.id : '';
  m.innerHTML=`<div class="sheet" role="dialog" aria-label="QRコード">
    <h3>QRコードで配る</h3>
    <p class="hint" style="margin-top:0">生徒はカメラで読み取るだけで開けます。記録はそれぞれのスマホに保存されます。</p>
    <div class="row" style="margin-top:4px"><label style="flex:1">開くページ
      <select id="qrTo" style="flex:1"><option value="">トップ（全セット）</option>${SETS.map(s=>`<option value="${s.id}" ${s.id===cur?'selected':''}>${s.test} ${s.name}</option>`).join('')}</select></label></div>
    <div class="qrbox" id="qrBox" style="margin-top:12px"><span class="hint">QRコードを作っています…</span></div>
    <div class="qrurl num" id="qrUrl"></div>
    <div class="row">
      <button type="button" class="btn2 solid" id="qrFull" style="flex:1">大きく表示（教室で映す）</button>
      <button type="button" class="btn2" id="qrCopy">URLをコピー</button>
    </div>
    <details style="margin-top:12px"><summary class="hint" style="cursor:pointer">公開URLを変更する</summary>
      <input class="qrin" id="qrBase" type="url" value="${esc(base)}" aria-label="公開URL" style="margin-top:8px">
      <p class="hint">サイトを置いた場所のURL。変えるとこの端末に保存されます。</p></details>
    <div class="row" style="justify-content:flex-end"><button type="button" class="chip" id="close">閉じる</button></div>
  </div>`;
  const url=()=>{ const b=($('#qrBase').value||DEFAULT_URL).trim(); const t=$('#qrTo').value; return t? b.replace(/#.*$/,'')+'#'+t : b; };
  const draw=()=>{ const u=url(); $('#qrUrl').textContent=u;
    loadQR().then(()=>{ $('#qrBox').innerHTML=qrSvg(u); })
      .catch(()=>{ $('#qrBox').innerHTML='<span class="hint">QRコードの部品を読み込めませんでした。ネットにつながっているか確認してください。</span>'; }); };
  draw();
  $('#qrTo').onchange=draw;
  $('#qrBase').onchange=()=>{ DB.qrUrl=$('#qrBase').value.trim()||undefined; save(); draw(); };
  $('#qrCopy').onclick=()=>{ const u=url(); (navigator.clipboard?.writeText(u)||Promise.reject()).then(()=>toast('URLをコピーしました')).catch(()=>{ const r=document.createRange(); r.selectNodeContents($('#qrUrl')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('URLを選択しました'); }); };
  $('#qrFull').onclick=()=>{ if(!window.qrcode) return; const t=$('#qrTo').value; const f=document.createElement('div'); f.className='qrfull'; f.setAttribute('role','dialog');
    f.innerHTML=`${qrSvg(url())}<p>統一テスト語彙ドリル${t?'　'+SET[t].test+' '+SET[t].name:''}</p><small>スマホのカメラで読み取ってください（タップで閉じる）</small>`;
    f.onclick=()=>f.remove(); document.body.appendChild(f); };
  const close=()=>{m.hidden=true}; $('#close').onclick=close; m.onclick=e=>{if(e.target===m)close()};
}
